<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/greenway_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenWay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #F9FAFB;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .splash-logo {
        width: 120px; /* Large splash logo */
        height: 120px;
        border-radius: 30px;
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.2);
        margin-bottom: 24px;
        animation: pulse 2s infinite ease-in-out;
      }
      .splash-name {
        font-family: sans-serif;
        font-size: 28px;
        font-weight: 800;
        color: #1E293B;
        letter-spacing: -1px;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(1); opacity: 1; }
      }
      #root:not(:empty) + #splash-screen {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash-screen">
      <img src="/greenway_logo.png" class="splash-logo" alt="GreenWay">
      <div class="splash-name">GreenWay</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
